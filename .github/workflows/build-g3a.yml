name: Build G3A

on:
  push:            # runs on any push to any branch
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # lets you run it manually from Actions tab

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git python3 pkg-config \
            libpng-dev libusb-1.0-0-dev libsdl2-dev libudisks2-dev \
            libglib2.0-dev libgirepository1.0-dev zlib1g-dev \
            gcc-sh-elf binutils-sh-elf libnewlib-sh-elf-dev \
            libmpfr-dev libmpc-dev libppl-dev

      - name: Get giteapc
        run: git clone --depth 1 https://git.planet-casio.com/Lephenixnoir/giteapc /tmp/giteapc

      - name: Install fxsdk & gint toolchain
        run: |
          python3 /tmp/giteapc/giteapc.py install Lephenixnoir/fxsdk
          python3 /tmp/giteapc/giteapc.py install Lephenixnoir/gint

      - name: Add fxsdk to PATH for later steps
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sanity check
        run: |
          fxsdk --version
          sh-elf-gcc --version

      - name: Configure (fx-CG100 / Graph Math+)
        run: cmake -B build-cw -S . -DCMAKE_TOOLCHAIN_FILE=$HOME/.local/lib/cmake/fxsdk/FXCG50.cmake -DPLATFORM=cw

      - name: Build (fx-CG100 / Graph Math+)
        run: cmake --build build-cw -j2

      - name: Configure (fx-CG50 / Graph 90+E)
        run: cmake -B build-cg -S . -DCMAKE_TOOLCHAIN_FILE=$HOME/.local/lib/cmake/fxsdk/FXCG50.cmake -DPLATFORM=cg

      - name: Build (fx-CG50 / Graph 90+E)
        run: cmake --build build-cg -j2

      - name: Verify built .g3a artifacts
        run: |
          mkdir -p dist
          cp build-cw/prizoop_cw.g3a dist/prizoop_cw.g3a
          cp build-cg/prizoop_cg.g3a dist/prizoop_cg.g3a
          ls -lh dist/

      - name: Upload fx-CG100 / Graph Math+ .g3a
        uses: actions/upload-artifact@v4
        with:
          name: prizoop-cg100-g3a
          path: dist/prizoop_cw.g3a

      - name: Upload fx-CG50 .g3a
        uses: actions/upload-artifact@v4
        with:
          name: prizoop-cg50-g3a
          path: dist/prizoop_cg.g3a
